global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ticket-service"
    static_configs:
      - targets: ["ticket-service:5000"]

  - job_name: "support-service"
    static_configs:
      - targets: ["support-service:5001"]

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:5002"]

  - job_name: "reporting-service"
    static_configs:
      - targets: ["reporting-service:5003"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
