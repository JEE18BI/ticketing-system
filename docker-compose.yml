services:
  frontend:
    build: ./frontend
    depends_on:
      - ticket-service
      - support-service
      - notification-service
      - reporting-service

  ticket-service:
    build: ./ticket-service
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: tickets_db
      NOTIFICATION_SERVICE_URL: http://notification-service:5002
    depends_on:
      - db
      - notification-service

  support-service:
    build: ./support-service
    environment:
      TICKET_SERVICE_URL: http://ticket-service:5000
      NOTIFICATION_SERVICE_URL: http://notification-service:5002
    depends_on:
      - ticket-service
      - notification-service

  notification-service:
    build: ./notification-service

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tickets_db
    volumes:
      - mysql_data:/var/lib/mysql

  reporting-service:
    build: ./reporting-service
    environment:
      TICKET_SERVICE_URL: http://ticket-service:5000
    depends_on:
      - ticket-service

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ticket-service
      - support-service
      - notification-service
      - reporting-service

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mysql_data:
  grafana_data:
