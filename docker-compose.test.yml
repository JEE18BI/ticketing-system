services:
  frontend:
    ports:
      - "8180:80"
    volumes:
      - ./frontend/config.test.js:/usr/share/nginx/html/config.js:ro

  ticket-service:
    ports:
      - "5100:5000"
    environment:
      DB_NAME: tickets_test_db

  support-service:
    ports:
      - "5101:5001"

  notification-service:
    ports:
      - "5102:5002"

  reporting-service:
    ports:
      - "5103:5003"

  db:
    environment:
      MYSQL_DATABASE: tickets_test_db
    ports:
      - "3310:3306"

volumes:
  mysql_data:
    name: ticketing-system-test_mysql_data
