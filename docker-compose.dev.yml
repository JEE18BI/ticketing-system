services:
  frontend:
    ports:
      - "8080:80"
    volumes:
      - ./frontend/config.dev.js:/usr/share/nginx/html/config.js:ro

  ticket-service:
    ports:
      - "5000:5000"
    environment:
      DB_NAME: tickets_dev_db

  support-service:
    ports:
      - "5001:5001"

  notification-service:
    ports:
      - "5002:5002"

  reporting-service:
    ports:
      - "5003:5003"

  db:
    environment:
      MYSQL_DATABASE: tickets_dev_db
    ports:
      - "3306:3306"

volumes:
  mysql_data:
    name: ticketing-system-dev_mysql_data
