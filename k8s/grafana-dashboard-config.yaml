apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  ticketing-dashboard.yml: |
    apiVersion: 1

    providers:
      - name: ticketing-system
        orgId: 1
        folder: Ticketing System
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
