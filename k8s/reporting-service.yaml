apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
    spec:
      containers:
      - name: reporting-service
        image: ticketing-system-reporting-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5003
        env:
        - name: TICKET_SERVICE_URL
          value: http://ticket-service:5000


---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
spec:
  selector:
    app: reporting-service
  ports:
    - port: 5003
      targetPort: 5003