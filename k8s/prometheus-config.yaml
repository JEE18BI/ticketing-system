apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: ticket-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - ticket-service:5000

      - job_name: support-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - support-service:5001

      - job_name: notification-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - notification-service:5002

      - job_name: reporting-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - reporting-service:5003
