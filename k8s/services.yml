apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: support-service
  template:
    metadata:
      labels:
        app: support-service
    spec:
      containers:
        - name: support-service
          image: support-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: support-service
spec:
  selector:
    app: support-service
  ports:
    - port: 5001
      targetPort: 5001
  type: NodePort
---
